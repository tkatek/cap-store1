<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEXO — Your Cart</title>
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="cart.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
</head>
<body>

<!-- NAV -->
<nav id="navbar">
  <div class="nav-left">
    <a href="index.html" class="back-btn">← SHOP</a>
  </div>
  <div class="nav-logo">VEXO</div>
  <div class="nav-right">
    <a href="cart.html" class="cart-link">
      <span class="cart-icon">🛒</span>
      <span class="cart-count" id="cartCount">0</span>
    </a>
  </div>
</nav>

<div class="cart-page">

  <!-- LEFT: CART ITEMS -->
  <div class="cart-left">
    <div class="cart-page-header">
      <span class="section-tag">YOUR BAG</span>
      <h1>Shopping Cart</h1>
      <p id="itemCountLabel">0 items</p>
    </div>

    <div id="cartItems" class="cart-items-list">
      <!-- Injected by JS -->
    </div>

    <div class="cart-empty" id="cartEmpty">
      <div class="empty-icon">🧢</div>
      <h3>Your bag is empty</h3>
      <p>Looks like you haven't added any caps yet.</p>
      <a href="full-collection.html" class="btn-primary">BROWSE COLLECTION</a>
    </div>
  </div>

  <!-- RIGHT: ORDER SUMMARY + CHECKOUT FORM -->
  <div class="cart-right">
    <div class="order-summary">
      <h3>Order Summary</h3>
      <div class="summary-lines" id="summaryLines"></div>
      <div class="summary-divider"></div>
      <div class="summary-total">
        <span>TOTAL</span>
        <span id="totalPrice">$0</span>
      </div>
      <div class="summary-note">Free shipping on orders over $100 🚀</div>
    </div>

    <!-- Checkout form -->
    <div class="checkout-form-wrap">
      <h3>Checkout Details</h3>
      <form id="checkoutForm" class="checkout-form">
        <div class="form-row">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" id="firstName" placeholder="John" required />
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" id="lastName" placeholder="Doe" required />
          </div>
        </div>
        <div class="form-group">
          <label>WhatsApp Number *</label>
          <input type="tel" id="whatsappNumber" placeholder="+1 234 567 8900" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="john@example.com" />
        </div>
        <div class="form-group">
          <label>Delivery Address *</label>
          <textarea id="address" placeholder="123 Street, City, Country" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label>Notes (optional)</label>
          <textarea id="notes" placeholder="Any special requests?" rows="2"></textarea>
        </div>
        <button type="submit" class="checkout-btn" id="checkoutBtn">
          <span class="whatsapp-icon">📱</span>
          ORDER VIA WHATSAPP
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span class="toast-icon">✓</span>
  <span id="toastMsg">Done!</span>
</div>

<script src="cart.js"></script>
</body>
</html>
